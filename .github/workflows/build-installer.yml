name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/twitch-unlink-companies-3f6a
    paths:
      - twitch_unlink/**

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable
        working-directory: twitch_unlink
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm twitch-drops-unlink.spec
      - name: Build Inno Setup installer
        uses: amake/innosetup-action@v2
        with:
          path: twitch_unlink/installer/TwitchDropsUnlink.iss
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TwitchDropsUnlink-Windows
          path: |
            twitch_unlink/dist/TwitchDropsUnlink/
            twitch_unlink/release/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tarball
        working-directory: twitch_unlink
        run: bash scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchDropsUnlink-Linux
          path: twitch_unlink/release/TwitchDropsUnlink-linux-x86_64.tar.gz