name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/dramastill-video-studio-ac51

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build window
        run: python -m PyInstaller --noconfirm --clean DramaStill.spec

      - name: Bundle FFmpeg
        shell: pwsh
        run: ./packaging/fetch_ffmpeg.ps1 -Dest dist/DramaStill

      - name: Zip
        shell: pwsh
        run: ./packaging/pack_download.ps1 -Source dist/DramaStill -OutZip DramaStill-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DramaStill-windows
          path: DramaStill-windows.zip
          if-no-files-found: error
          retention-days: 14
