[project]
name = "dramastill"
version = "1.0.0"
description = "Desktop studio that builds long dramatic YouTube videos from one cinematic still."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "httpx>=0.27",
  "edge-tts>=7.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "cryptography>=42.0",
]

[project.scripts]
dramastill = "dramastill.app:main"

[tool.setuptools.packages.find]
include = ["dramastill*"]

[tool.setuptools.package-data]
dramastill = ["resources/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
